aid: voltage
name: Voltage
description: >-
  Voltage is Bitcoin and Lightning Network money infrastructure that lets financial
  platforms send and receive instant, permissionless payments at scale. Its Payments
  API (voltageapi.com/v1) exposes wallets, payments, quotes, and lines of credit for
  BTC and USD settlement, backed either by a Voltage-managed line of credit or your
  own Lightning node. Voltage also runs managed Lightning node infrastructure (LND,
  Core Lightning, BTCPay Server) with macaroon-based access, webhooks for real-time
  payment events, a Mutinynet staging sandbox, and built-in OFAC/compliance risk
  screening via Amboss Reflex. The platform is SOC 2 Type II and NMLS compliant.
